[build]
  command = "cd frontend && npm install --legacy-peer-deps && npm run build"
  publish = "frontend/build"

[build.environment]
  NODE_VERSION = "18"
  REACT_APP_BACKEND_URL = "https://listworks-pro-v2-production.up.railway.app"

[[build.hooks.post_build]]
command = "cp frontend/public/index-seo.html frontend/build/index.html"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"

[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
